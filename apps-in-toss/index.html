<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>CastleRPG</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f08a24; touch-action: none; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      background: #f08a24 url('./game/index.png') center / cover no-repeat; }
    #bar { width: 60%; height: 10px; margin-bottom: 18vh; border-radius: 5px; background: rgba(0, 0, 0, 0.25); overflow: hidden; }
    #bar > div { width: 0; height: 100%; background: #fff3d6; transition: width 0.2s; }
    #exit { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.55);
      font-family: system-ui, sans-serif; }
    #exit .box { width: min(78vw, 320px); padding: 24px 20px 18px; border-radius: 18px; background: #fbf6ea; border: 3px solid #2b2f3a; text-align: center; }
    #exit p { margin: 0 0 18px; font-size: 18px; color: #1f2430; }
    #exit button { width: 46%; height: 48px; margin: 0 2%; border: 0; border-radius: 12px; font-size: 17px; font-weight: 700; }
    #exit-yes { background: #d9473a; color: #fff; }
    #exit-no { background: #5b6478; color: #fff; }
  </style>
</head>
<body>
  <canvas id="canvas">브라우저가 게임 화면을 지원하지 않아요.</canvas>
  <div id="loading"><div id="bar"><div></div></div></div>
  <div id="exit"><div class="box"><p>게임을 종료할까요?</p><button id="exit-no">계속하기</button><button id="exit-yes">종료</button></div></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
