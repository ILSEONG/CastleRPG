    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8fd8"/>
      <stop offset="1" stop-color="#a9d6f5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <polygon points="0,372 120,330 256,348 392,322 512,360 512,512 0,512" fill="#6cbf4a"/>
  <polygon points="0,372 120,330 256,348 256,512 0,512" fill="#5aa83c"/>
  <g transform="translate(256 262) scale(0.78) translate(-256 -227)">
