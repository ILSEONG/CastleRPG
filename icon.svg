  <rect x="160" y="230" width="20" height="30" rx="10" fill="#3b2a1e"/>
  <!-- 오른쪽 탑 -->
  <polygon points="312,190 372,190 372,368 312,368" fill="#c4bdb1"/>
  <polygon points="342,190 372,190 372,368 342,368" fill="#aaa295"/>
